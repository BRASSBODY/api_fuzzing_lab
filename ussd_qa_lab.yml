name: EmpayIT USSD API Automation Lab

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests requests-mock jsonschema pytest-html schemathesis

    - name: Execute USSD E2E & Security Test Suites
      run: |
        mkdir -p reports
        pytest test_ussd_e2e_flows.py test_ussd_security_abuse.py --html=reports/security_e2e_report.html --self-contained-html -v

    - name: Archive Test Execution HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: USSD-QA-Execution-Report
        path: reports/security_e2e_report.html